name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --check

      - name: Run Rust library tests
        run: cargo test --lib

      - name: Run compatibility CLI tests
        continue-on-error: true
        run: cargo test --test cli_tests

  shell-functionality:
    name: Shell functionality tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build rubash
        run: cargo build

      - name: Run shell functionality tests
        run: bash tests/run_all_tests.sh

  bash-upstream-progress:
    name: Bash upstream test progress
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Run GNU Bash upstream tests
        run: scripts/run-bash-upstream-tests.sh

      - name: Publish progress summary
        if: always()
        run: |
          if [[ -f target/bash-upstream-tests/summary.md ]]; then
            cat target/bash-upstream-tests/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bash upstream summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload upstream test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bash-upstream-test-progress
          path: |
            target/bash-upstream-tests/summary.md
            target/bash-upstream-tests/results.tsv
            target/bash-upstream-tests/logs

  github-release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - rust
      - shell-functionality
      - bash-upstream-progress
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "Release tags must look like v0.2.0, v1.0.0, etc. Got: $tag" >&2
            exit 1
          fi

          if ! git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "Release tag does not exist: $tag" >&2
            exit 1
          fi

          tag_sha="$(git rev-list -n 1 "$tag")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "Checked-out commit $head_sha does not match $tag at $tag_sha" >&2
            exit 1
          fi

          version="${tag#v}"
          cargo_pkgid="$(cargo pkgid)"
          # cargo pkgid returns "name@version" for registry packages and
          # "path+file:///...#version" for path packages. Extract the
          # version after either @ or #, whichever appears last.
          cargo_version="${cargo_pkgid##*[@#]}"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Tag $tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Verify package
        run: cargo package --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux binary
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp target/release/rubash dist/rubash
          tar -C dist -czf "dist/rubash-${tag}-x86_64-unknown-linux-gnu.tar.gz" rubash
          sha256sum "dist/rubash-${tag}-x86_64-unknown-linux-gnu.tar.gz" > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            "dist/rubash-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/SHA256SUMS" \
            --title "$tag" \
            --generate-notes \
            --latest \
            --verify-tag

  github-release-macos:
    name: Publish macOS release binary
    runs-on: macos-latest
    needs:
      - github-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      # macos-latest is arm64, so this builds the aarch64-apple-darwin
      # binary natively; the linux job above produces x86_64-linux-gnu.
      - name: Build release binary
        run: cargo build --release --locked

      - name: Package and upload macOS binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp target/release/rubash dist/rubash
          tar -C dist -czf "dist/rubash-${tag}-aarch64-apple-darwin.tar.gz" rubash
          shasum -a 256 "dist/rubash-${tag}-aarch64-apple-darwin.tar.gz" > dist/SHA256SUMS-darwin
          gh release upload "$tag" \
            "dist/rubash-${tag}-aarch64-apple-darwin.tar.gz" \
            "dist/SHA256SUMS-darwin" \
            --clobber

  crates-io-publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs:
      - github-release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "Release tags must look like v0.2.0, v1.0.0, etc. Got: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          cargo_pkgid="$(cargo pkgid)"
          cargo_version="${cargo_pkgid##*[@#]}"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Tag $tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Package
        run: cargo package --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
